    <title>Page Not Found | KWA Appliances</title>
    <script>
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var base = parts[0] === 'kwa-appliances-website' ? '/kwa-appliances-website/' : '/';
        var brandIndex = parts.indexOf('brands');
        var slug = brandIndex >= 0 ? parts[brandIndex + 1] : '';
        var brandTargets = {
          'bosch': 'catalogue.html?brand=Bosch',
          'kitchenaid': 'catalogue.html?brand=KitchenAid',
          'thermador': 'catalogue.html?brand=Thermador',
          'sub-zero-wolf': 'catalogue.html?brand=Sub-Zero'
        };
        if (brandIndex >= 0) {
          location.replace(base + (brandTargets[slug] || 'brands/'));
        }
      }());
    </script>

  </head>
